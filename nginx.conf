events { worker_connections 1024; }
http {
  upstream app { server app:3000; }
  # HTTP — ACME challenge + redirect to HTTPS when cert exists
  server {
    listen 80;
    server_name _;
    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }
    location / {
      proxy_pass http://app;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
  # HTTPS — active when certbot has issued certs; fallback to HTTP if not yet
  # To enable TLS, ensure /etc/letsencrypt/live/<domain>/fullchain.pem exists and uncomment below.
  # server {
  #   listen 443 ssl;
  #   server_name example.com;
  #   ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
  #   ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
  #   include /etc/letsencrypt/options-ssl-nginx.conf;
  #   ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
  #   location / {
  #     proxy_pass http://app;
  #     proxy_set_header Host $host;
  #     proxy_set_header X-Real-IP $remote_addr;
  #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  #     proxy_set_header X-Forwarded-Proto $scheme;
  #   }
  # }
}
