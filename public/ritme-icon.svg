  <!-- pulse / rhythm wave inside -->
  <path d="M 10.5 20 L 14.2 20 L 16 14.2 L 18.2 25.8 L 20.6 15.2 L 22.8 20 L 29.5 20" fill="none" stroke="white" stroke-width="2.05" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="29.5" cy="20" r="1.7" fill="white"/>
</svg>
