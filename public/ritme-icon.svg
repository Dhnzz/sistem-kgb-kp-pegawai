<svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 40 40" role="img" aria-label="Ritme icon">
  <title>Ritme — icon</title>
  <rect width="40" height="40" rx="10" fill="#2563EB"/>
  <!-- outer rhythm ring — dashed circle suggesting periodic cycle (2y / 4y) -->
